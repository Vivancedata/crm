version: 2

# Majors are deliberately excluded from the groups, which means Dependabot
# raises them as individual PRs instead.
#
# Previously every update landed in two giant grouped PRs. One group carried
# eslint 9->10, tailwind 3->4, zod 3->4 and tailwind-merge 2->3 together, so the
# PR could only merge by completing four unrelated migrations at once. None ever
# were: the PRs sat open for months and the safe patch updates inside them --
# including security fixes -- were held hostage to them.
#
# Now minor/patch flows continuously as a group, and each major arrives on its
# own so it can be scheduled as the piece of real work it is.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # The AI SDK is the one exception to "majors arrive individually",
      # because the provider packages implement a spec version that the `ai`
      # core defines. Split up, the majors are not merely inconvenient -- they
      # are individually impossible: #23 bumped @ai-sdk/anthropic 3 -> 4, whose
      # model type is LanguageModelV4, while `ai` stayed where it was and still
      # expected LanguageModel. Type Check failed at three call sites in
      # src/lib/actions/ai.ts and could not have passed without `ai` moving too.
      #
      # This does not recreate the hostage problem the note above describes:
      # that was four unrelated migrations sharing a branch. This is one SDK
      # whose halves only typecheck when they move together.
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
        update-types: ["major", "minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
